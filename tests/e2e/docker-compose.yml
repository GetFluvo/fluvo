# e2e test stack for fluvo.
# Brought up / torn down by tests/e2e/conftest.py (runtime-agnostic: podman or docker).
# The Odoo version is injected via the FLUVO_E2E_ODOO_VERSION env var (default 18.0).
# Not used in normal `pytest` runs (tests/e2e is excluded by default); only the e2e session.

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:${FLUVO_E2E_ODOO_VERSION:-18.0}
    depends_on:
      - db
    ports:
      - "${FLUVO_E2E_ODOO_PORT:-8069}:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    # Long-running server; the harness execs `odoo -d <db> -i base --stop-after-init`
    # into this container to create the source/target databases on demand.
    command: ["odoo", "--db_host=db", "--db_user=odoo", "--db_password=odoo"]

  # Fault-injection TCP proxy in front of Odoo, for the opt-in chaos/resilience
  # tests (-m chaos). A test creates a proxy (localhost:18070 -> odoo:8069) via the
  # control API on :8474 and adds toxics (reset_peer, latency, ...) to it.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    depends_on:
      - odoo
    ports:
      - "${FLUVO_E2E_TOXIPROXY_API_PORT:-8474}:8474" # control API
      - "${FLUVO_E2E_TOXIPROXY_PORT:-18070}:18070" # proxied Odoo
    command: ["-host=0.0.0.0"]
