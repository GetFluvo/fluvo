name: Release

# Tag-triggered release. Push an annotated tag like `v0.0.1` (matching the
# version in pyproject.toml) to build and publish to PyPI via Trusted Publishing
# (OIDC) — no API token secrets required.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing
      contents: write # create the GitHub release notes
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv version | awk '{ print $2 }')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject version '${pkg}'."
            exit 1
          fi
          echo "Releasing version ${pkg}."

      - name: Build package
        # Build a pure-Python wheel + sdist. We deliberately do NOT set
        # FLUVO_COMPILE_MYPYC here: a mypyc-compiled wheel gets a `linux_x86_64`
        # platform tag, which PyPI rejects (it requires manylinux). Compiled
        # manylinux/macos/windows wheels can be added later via cibuildwheel.
        run: uv build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v6.1.0
        with:
          publish: true
          tag: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
