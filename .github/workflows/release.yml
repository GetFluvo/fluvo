name: Release

# Tag-triggered release. Push an annotated tag like `v0.0.2` (matching the version
# in pyproject.toml) to build compiled (mypyc) wheels for every platform via
# cibuildwheel + an sdist, then publish to PyPI via Trusted Publishing (OIDC).
#
# `workflow_dispatch` builds the wheels WITHOUT publishing, so the matrix can be
# tested before committing to a real release tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build compiled (mypyc) wheels
        uses: pypa/cibuildwheel@v4.1.0
        # All build settings live in [tool.cibuildwheel] in pyproject.toml.

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Only publish on a real version tag, never on a workflow_dispatch test build.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing
      contents: write # create the GitHub release notes
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject version '${pkg}'."
            exit 1
          fi
          echo "Releasing version ${pkg}."

      - name: Collect all build artifacts into dist/
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v7.3.1
        with:
          publish: true
          tag: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
