name: CLA Assistant

# Records that every outside contributor has agreed to the Contributor License
# Agreement (CLA.md) before their PR is merged. The CLA preserves Fluvo's
# open-core option: the right to license contributions under both LGPL-3.0 and a
# separate commercial license. Without this gate, an unsigned outside PR erodes
# that option the moment it merges.
#
# How it works: on a PR from a non-allowlisted author, the action posts a comment
# asking them to sign by replying with the exact sentence below. The signature is
# recorded in a JSON file on a dedicated `cla-signatures` branch. The gate is this
# job's own check-run, named `cla`: it FAILS when a committer has not signed and
# succeeds when everyone has (or is allowlisted). `cla` is a required status check
# on master. It lives in its own workflow (it needs `pull_request_target` +
# `issue_comment` triggers and elevated permissions), so it cannot be folded into
# the `all-checks` job in tests.yml, which only aggregates jobs within that
# workflow.
#
# NOTE: the action does not set a separate `license/cla` commit status in v2.6.1 —
# requiring that context would block every PR on a status that never arrives.
# Require the `cla` job instead.
#
# Setup (done; recorded here so it can be reproduced):
#   * Repo secret `PERSONAL_ACCESS_TOKEN` — a fine-grained PAT scoped to this repo
#     with Contents: read & write, so the action can commit signatures.
#   * The `cla-signatures` branch must EXIST (the action does not create it) and
#     must stay UNPROTECTED, or the action cannot commit to it.
#   * `cla` added to the required status checks on `master`.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # The action can't persist a signature without a PAT (it needs to create/commit
    # to the cla-signatures branch), and it hard-errors when the PAT is absent —
    # which would red-X every PR before the one-time setup is done. Until the
    # PERSONAL_ACCESS_TOKEN secret exists, skip the job cleanly so it doesn't block
    # or alarm; the moment the secret is added, enforcement turns on automatically.
    #
    # CAUTION: now that `cla` is a REQUIRED check, this guard is also a silent
    # failure mode — if the PAT is ever revoked or expires, the job skips, and
    # GitHub counts a skipped required check as passing. Enforcement would be off
    # with every PR still green. Re-check this when rotating the token.
    env:
      HAS_PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}
    steps:
      - name: CLA Assistant
        if: >-
          env.HAS_PAT == 'true'
          && ((github.event.comment.body == 'recheck'
            || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target')
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Persists the signature to the cla-signatures branch. Required — the job
          # is skipped (above) until this secret is set.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/GetFluvo/fluvo/blob/master/CLA.md
          branch: cla-signatures
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, we need you to
            agree to our [Contributor License Agreement](https://github.com/GetFluvo/fluvo/blob/master/CLA.md).
            Please read it, then post the following comment on this PR:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. ✅
          # Maintainers and bots are exempt so this never blocks Dependabot
          # auto-merge or internal work.
          allowlist: bosd,*[bot]
