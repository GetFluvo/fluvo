name: End-to-End Integrity Tests

on:
  workflow_dispatch:
    inputs:
      odoo_version:
        description: "Odoo version to test (e.g. 16.0, 17.0, 18.0, 19.0)"
        required: false
        default: "18.0"
  schedule:
    # Nightly small-tier run across supported Odoo versions.
    - cron: "0 3 * * *"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        odoo_version: >-
          ${{ github.event_name == 'workflow_dispatch'
              && fromJSON(format('["{0}"]', github.event.inputs.odoo_version))
              || fromJSON('["16.0", "17.0", "18.0", "19.0"]') }}
    env:
      # Small CI tier: fast, still exercises every integrity scenario.
      FLUVO_E2E_SCALE: "5000"
      FLUVO_E2E_ODOO_VERSION: ${{ matrix.odoo_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Run e2e integrity suite (small tier) on Odoo ${{ matrix.odoo_version }}
        run: uv run nox -s e2e

      - name: Upload e2e coverage to Codecov
        # Always upload: partial coverage from a failed scenario is still useful,
        # and this must not gate the e2e run. Each matrix Odoo version uploads under
        # the same `e2e` flag; Codecov unions them (a line covered by any version
        # counts). codecov.yml carries this flag forward onto non-nightly commits.
        if: always()
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage-e2e.xml
          flags: e2e
          fail_ci_if_error: false
