name: End-to-End Integrity Tests

on:
  workflow_dispatch:
    inputs:
      odoo_version:
        description: "Odoo version to test (e.g. 16.0, 17.0, 18.0, 19.0)"
        required: false
        default: "18.0"
  schedule:
    # Nightly small-tier run across supported Odoo versions.
    - cron: "0 3 * * *"
  release:
    types: [published]

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        odoo_version: >-
          ${{ github.event_name == 'workflow_dispatch'
              && fromJSON(format('["{0}"]', github.event.inputs.odoo_version))
              || fromJSON('["16.0", "17.0", "18.0", "19.0"]') }}
    env:
      # Small CI tier: fast, still exercises every integrity scenario.
      ODF_E2E_SCALE: "5000"
      ODF_E2E_ODOO_VERSION: ${{ matrix.odoo_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Run e2e integrity suite (small tier) on Odoo ${{ matrix.odoo_version }}
        run: uv run nox -s e2e
